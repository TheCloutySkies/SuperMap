# Keep the static home seed fresh so a brand-new visitor paints instantly.
#
# The seed is served by the CDN as /home-seed.json. Without it, a wiped browser
# waits for Render Free to wake (~22s) and for cold caches to fill (~24-42s).
# This runs every 30 minutes, writes only when the payload changed, and never
# blanks the seed when the API returns nothing useful.
name: Refresh home seed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-seed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the seed from the live API
        env:
          API_HOME_URL: https://supermap-api.onrender.com/api/home
          SEED_TIMEOUT_MS: '120000'
        run: node Documents/SuperMap/scripts/build-home-seed.mjs

      - name: Commit the seed when it changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Documents/SuperMap/SuperMap/public/home-seed.json
          if git diff --cached --quiet; then
            echo "seed unchanged"
            exit 0
          fi
          git commit -m "Refresh the home seed snapshot"
          git push
