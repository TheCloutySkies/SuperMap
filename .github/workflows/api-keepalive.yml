# Keep Render free-tier API awake so HomeScreen / feeds paint without multi-minute cold starts.
# Prefer /api/home (not only /health) so in-memory last-good stays warm after wake.
# No paid disk / DATA_DIR required — this is the primary free-tier keep-warm path.
#
# Root cause of intermittent HTTP 429 (not Express):
#   *.onrender.com sits behind Cloudflare. Render Free often returns 429 during
#   cold spin-up / edge throttling of shared CI IPs. There is no express-rate-limit
#   in situational-awareness-api — /health is unrestricted in-app.
# Soften: longer backoff on 429, still warm /api/home, soft-exit when only 429s.
name: API keepalive

on:
  schedule:
    # Every 10 minutes (do not raise frequency — avoids stampeding Render Free)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping situational-awareness API (/health + /api/home)
        run: |
          set +e
          HEALTH_URL="${API_HEALTH_URL:-https://supermap-api.onrender.com/health}"
          HOME_URL="${API_HOME_URL:-https://supermap-api.onrender.com/api/home}"
          echo "Pinging $HEALTH_URL then $HOME_URL"
          # Render Free cold start + edge 429 windows can exceed a fixed 15s retry.
          # Capture status (no -f) so 429 can use longer backoff than connect errors.
          health_ok=0
          last_health=000
          for i in 1 2 3 4 5 6; do
            hdr=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$hdr" -o "$body" --connect-timeout 30 --max-time 120 \
              -w '%{http_code}' "$HEALTH_URL" || echo "000")
            last_health="$code"
            retry_after=$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/{print $2}' "$hdr" | tr -d '\r' | head -1)
            echo "health attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              cat "$body"
              echo
              echo "health OK (attempt $i)"
              health_ok=1
              rm -f "$hdr" "$body"
              break
            fi
            # Dump a few headers when rate-limited (helps confirm edge vs origin)
            if [ "$code" = "429" ]; then
              echo "--- 429 headers (truncated) ---"
              awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|retry-after:|cf-|server:|x-render|rndr-|ratelimit)/{print}' "$hdr" | head -20
              # Honor Retry-After when present; else exponential-ish backoff (do not stampede)
              if [ -n "$retry_after" ] && [ "$retry_after" -eq "$retry_after" ] 2>/dev/null; then
                sleep_s=$retry_after
                if [ "$sleep_s" -lt 20 ]; then sleep_s=20; fi
                if [ "$sleep_s" -gt 90 ]; then sleep_s=90; fi
              else
                case $i in
                  1) sleep_s=25 ;;
                  2) sleep_s=40 ;;
                  3) sleep_s=55 ;;
                  4) sleep_s=70 ;;
                  *) sleep_s=85 ;;
                esac
              fi
              echo "429 — sleeping ${sleep_s}s before retry (Render Free / CF edge)"
              sleep "$sleep_s"
            else
              echo "health non-OK; retrying in 20s..."
              sleep 20
            fi
            rm -f "$hdr" "$body"
          done

          # Always attempt home warm — even if /health stayed on 429 after wake window
          home_ok=0
          last_home=000
          for j in 1 2 3; do
            code=$(curl -sS -o /tmp/home-keepalive.json --connect-timeout 30 --max-time 90 \
              -w '%{http_code}' "$HOME_URL" || echo "000")
            last_home="$code"
            echo "home attempt $j → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "home OK ($(wc -c < /tmp/home-keepalive.json) bytes)"
              home_ok=1
              break
            fi
            if [ "$code" = "429" ]; then
              case $j in
                1) sleep_s=30 ;;
                2) sleep_s=50 ;;
                *) sleep_s=70 ;;
              esac
              echo "home 429 — sleeping ${sleep_s}s"
              sleep "$sleep_s"
            else
              echo "home soft error; brief retry..."
              sleep 15
            fi
          done

          if [ "$health_ok" = "1" ] || [ "$home_ok" = "1" ]; then
            echo "Keepalive succeeded (health_ok=$health_ok home_ok=$home_ok)"
            exit 0
          fi

          # Persistent edge 429: soft-exit so Actions does not hard-fail; next cron (~10m) retries.
          # Hard-failing does not wake Render and only stamps red on noise.
          if [ "$last_health" = "429" ] || [ "$last_home" = "429" ]; then
            echo "::warning::Keepalive soft-failed on HTTP 429 (health=$last_health home=$last_home). Edge throttle — not Express rate-limit. Next schedule will retry."
            exit 0
          fi

          echo "::error::Keepalive failed (health=$last_health home=$last_home) after retries"
          exit 1
        env:
          API_HEALTH_URL: https://supermap-api.onrender.com/health
          API_HOME_URL: https://supermap-api.onrender.com/api/home
